[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP security gateway: Bearer auth, single policy point, fail-closed reverse proxy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2==2.16.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mcp==2.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
